[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metso-assistant"
version = "0.1.0"
description = "A small LangGraph assistant with Chroma retrieval and Pydantic service costs"
requires-python = ">=3.14,<3.15"
dependencies = [
  "google-genai>=1.75,<2",
  "httpx>=0.28,<1",
  "chromadb>=1.1,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "langgraph>=1,<2",
  "rich>=14,<15",
  "langfuse>=5.0.2,<6",
  "openinference-instrumentation-google-genai>=1.4.13,<2",
]

[project.scripts]
metso-assistant = "src.terminal.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/pyproject.toml", "/uv.lock", "/.python-version", "/.env.example", "/.gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
